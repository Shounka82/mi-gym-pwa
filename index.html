<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101b19"><meta name="description" content="Tu rutina de fuerza y glúteos, con registro privado de series y progreso."><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png"><link rel="apple-touch-icon" href="./icon-192.png"><title>Mi Gym Privado</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#edf4ef;background:#101b19;font-size:15px}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:2;background:#101b19ee;backdrop-filter:blur(12px);padding:16px max(18px,env(safe-area-inset-left));border-bottom:1px solid #34453d}.head{max-width:720px;margin:auto;display:flex;justify-content:space-between;align-items:center}.logo{font-size:22px;font-weight:800}.small{color:#b5c6bb;font-size:12px}.shell{max-width:720px;margin:auto;padding:20px 16px 100px}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:16px 0}.tab{background:#24352f;color:#cbd9cf;border:1px solid #3b5045;border-radius:13px;padding:13px 4px}.tab.active{background:#2e7858;color:white;border-color:#7cc7a1}.panel{background:#1b2b25;border:1px solid #344b3e;border-radius:18px;padding:16px;margin:12px 0}.title{font-size:25px;line-height:1.2;margin:5px 0 8px}h2{font-size:17px;margin:0 0 10px}.muted{color:#b8c9be}.line{display:flex;justify-content:space-between;gap:10px;align-items:center}.pill{background:#315b45;color:#dcf6e7;padding:5px 10px;border-radius:30px;font-size:12px}.progress{height:9px;background:#34483e;border-radius:20px;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:#65d39a}.exercise{padding:15px 0;border-top:1px solid #35483e}.exercise:first-of-type{border:0}.ex-title{font-weight:700}.detail{font-size:12px;color:#bbcec1;margin:5px 0 12px}.setgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.set{background:#263a30;border:1px solid #3a5143;border-radius:12px;padding:10px 8px}.set label{display:block;color:#b5c9bb;font-size:11px;margin-bottom:5px}.set input{width:100%;min-width:0;background:#14231c;color:white;border:1px solid #506657;border-radius:7px;padding:9px 5px}.set button{border:1px solid #5d7664;border-radius:8px;background:#2a4234;color:#e8f6ed;width:100%;padding:9px 4px;margin-top:7px}.set button.done{background:#2e8b59;border-color:#63cc8b}.primary{background:#64d798;color:#092316;font-weight:750;border:0;border-radius:12px;padding:13px 16px}.secondary{background:#2b4236;color:#ecf8ef;border:1px solid #577362;border-radius:12px;padding:12px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.input{width:100%;background:#14231c;color:#f4fff7;border:1px solid #577262;border-radius:9px;padding:12px}.rowgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.section{margin:25px 0 10px}.warning{border-left:3px solid #e2c17a;padding:10px 12px;background:#302d21;border-radius:8px;font-size:13px;color:#f4e7c6}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#16251ef5;border-top:1px solid #365044;padding:8px 10px calc(8px + env(safe-area-inset-bottom));gap:6px}.nav button{flex:1;max-width:160px;background:none;border:0;color:#a6bcb0;padding:10px 2px;border-radius:9px}.nav button.active{background:#2c4e3b;color:white}canvas{max-width:100%}table{width:100%;border-collapse:collapse}td,th{padding:9px 3px;border-bottom:1px solid #395045;text-align:left;font-size:13px}input[type=checkbox]{width:20px;height:20px;accent-color:#6cdb9f} @media(max-width:390px){.setgrid{gap:5px}.set{padding:8px 5px}.shell{padding-left:11px;padding-right:11px}} 
</style></head><body><header><div class="head"><div><div class="logo">🏋️ Mi Gym</div><div class="small">Tu entrenamiento · Tus datos</div></div><span class="pill">🔒 En este dispositivo</span></div></header><main id="app" class="shell"></main><nav class="nav"><button data-view="train" class="active">🏋️<br>Entrenar</button><button data-view="progress">📈<br>Progreso</button><button data-view="settings">⚙️<br>Datos</button></nav>
<script>
"use strict";
const PLAN=[
["Pecho, hombros y tríceps",[["Press de pecho con mancuernas",3,"8–12","kg por mancuerna"],["Press inclinado con mancuernas",3,"10–12","kg por mancuerna"],["Press de hombros sentado",3,"8–12","kg por mancuerna"],["Elevaciones laterales",3,"12–15","kg por mancuerna"],["Extensión de tríceps con mancuerna",3,"10–15","kg total"]]],
["Glúteos y piernas",[["Hip thrust con barra",4,"8–12","kg total"],["Peso muerto rumano con mancuernas",3,"10–12","kg por mancuerna"],["Sentadilla parcial al banco",3,"10–12","kg total"],["Abducción de cadera tumbado de lado",3,"15 por lado","kg opcional"],["Elevación de gemelos",3,"12–15","kg total"]]],
["Espalda, bíceps y abdominales",[["Remo con mancuerna en banco",4,"8–12 por lado","kg por mancuerna"],["Remo en TRX",3,"10–12","inclinación (escribe nivel)"],["Pájaros con mancuernas",3,"12–15","kg por mancuerna"],["Curl de bíceps con mancuernas",3,"10–12","kg por mancuerna"],["Plancha abdominal",3,"30–45 s","segundos"]]],
["Glúteos, rodilla y core",[["Glute bridge con mancuerna",3,"12–15","kg total"],["Peso muerto rumano con barra",3,"10–12","kg total"],["Sentarse y levantarse del banco",3,"10–12","kg total"],["Elevación de pierna recta tumbado",3,"12 por lado","kg opcional"],["Crunch abdominal",3,"12–15","repeticiones"]]],
["Tren superior completo",[["Press de pecho con mancuernas",3,"8–12","kg por mancuerna"],["Remo con mancuerna en banco",3,"10 por lado","kg por mancuerna"],["Press de hombros sentado",3,"10–12","kg por mancuerna"],["Curl martillo con mancuernas",3,"10–12","kg por mancuerna"],["Extensión de tríceps con mancuerna",3,"12","kg total"]]]
];
const STORE="migym_v1";let state;try{state=JSON.parse(localStorage.getItem(STORE))||{}}catch{state={}};state.sessions??={};state.metrics??=[];state.day??=0;state.week??=1;let view="train";const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const save=()=>{try{localStorage.setItem(STORE,JSON.stringify(state))}catch{alert("No se ha podido guardar en este navegador. Exporta una copia de seguridad.")}};const sid=()=>`${state.week}_${state.day}`;function session(){const id=sid();return state.sessions[id]??(state.sessions[id]={date:new Date().toISOString().slice(0,10),sets:{},notes:"",warm:false,cardio:false,cool:false})}function setsCount(d){const s=state.sessions[`${state.week}_${d}`];return Object.values(s?.sets||{}).filter(x=>x.done).length}function expected(d){return PLAN[d][1].reduce((a,e)=>a+(state.week===1?2:state.week===2?Math.min(3,e[1]):e[1]),0)}function render(){document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===view));if(view==="train")train();else if(view==="progress")progress();else settings()}
function train(){const s=session(),p=PLAN[state.day],total=PLAN.reduce((a,p,i)=>a+setsCount(i),0),max=PLAN.reduce((a,p,i)=>a+expected(i),0);$("app").innerHTML=`<div class="line"><div><div class="small">PLAN PERSONAL · 5 DÍAS</div><h1 class="title">Semana ${state.week}</h1></div><div class="actions"><button class="secondary" id="prevW" ${state.week<=1?"disabled":""}>−</button><button class="secondary" id="nextW">+</button></div></div><div class="muted">Series completadas esta semana: ${total} / ${max}</div><div class="progress"><div style="width:${Math.min(100,100*total/max)}%"></div></div><div class="tabs">${PLAN.map((p,i)=>`<button class="tab ${i===state.day?"active":""}" data-day="${i}">${["L","M","X","J","V"][i]}<br><small>${setsCount(i)}/${expected(i)}</small></button>`).join("")}</div><div class="line"><div><h1 class="title">${p[0]}</h1><div class="muted">8 min calentar · 42 min fuerza · 5 min cardio · 5 min vuelta a la calma</div></div></div>${state.week<=2?`<p class="warning">Readaptación: semana ${state.week}. ${state.week===1?"Solo 2 series por ejercicio.":"2–3 series por ejercicio."} Usa cargas cómodas y deja 3–4 repeticiones de margen.</p>`:""}<div class="panel"><label class="small">Fecha de sesión</label><input class="input" id="date" type="date" value="${esc(s.date)}"><p><label><input type="checkbox" id="warm" ${s.warm?"checked":""}> Calentamiento realizado (8 min)</label></p></div><h2 class="section">Ejercicios y series</h2>${p[1].map((e,i)=>{let n=state.week===1?2:state.week===2?Math.min(3,e[1]):e[1];return `<section class="panel"><div class="line"><div><div class="ex-title">${i+1}. ${e[0]}</div><div class="detail">${n} series · ${e[2]} · ${e[3]}</div></div><span class="pill">${Object.keys(s.sets).filter(k=>k.startsWith(i+"_")&&s.sets[k].done).length}/${n}</span></div><div class="setgrid">${Array.from({length:n},(_,j)=>{let r=s.sets[`${i}_${j}`]||{};return `<div class="set"><label>Serie ${j+1}</label><label>${e[3].includes("kg")?"Peso (kg)":e[3].includes("segundos")?"Segundos":e[3].includes("inclinación")?"Nivel":"Reps"}</label><input data-e="${i}" data-s="${j}" data-field="weight" type="${e[3].includes("inclinación")?"text":"number"}" step="any" min="0" placeholder="—" value="${esc(r.weight??"")}"><label>Reps / tiempo</label><input data-e="${i}" data-s="${j}" data-field="reps" type="number" min="0" placeholder="—" value="${esc(r.reps??"")}"><button data-e="${i}" data-s="${j}" data-done="1" class="${r.done?"done":""}">${r.done?"✓ Hecha":"Marcar"}</button></div>`}).join("")}</div></section>`}).join("")}<div class="panel"><label><input type="checkbox" id="cardio" ${s.cardio?"checked":""}> Cardio final (5 min): marcha sin impacto</label><p><label><input type="checkbox" id="cool" ${s.cool?"checked":""}> Vuelta a la calma (5 min)</label></p><label class="small">Notas · Sensaciones de rodilla</label><textarea class="input" id="notes" rows="3" placeholder="Ej.: sin dolor, subir 2 kg la próxima semana...">${esc(s.notes)}</textarea></div><p class="warning">Menisco izquierdo: evita giros bruscos, cargas repentinas y movimientos dolorosos. Detén el ejercicio ante dolor, hinchazón, bloqueo o inestabilidad. Valora revisión de fisioterapia.</p><div class="actions"><button class="primary" id="nextDay">Siguiente día →</button></div>`;
document.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{state.day=+b.dataset.day;save();render()});$("prevW").onclick=()=>{state.week=Math.max(1,state.week-1);save();render()};$("nextW").onclick=()=>{state.week++;save();render()};$("nextDay").onclick=()=>{state.day=(state.day+1)%5;save();render()};["date","warm","cardio","cool","notes"].forEach(k=>$(k).onchange=e=>{s[k]=e.target.type==="checkbox"?e.target.checked:e.target.value;save()});document.querySelectorAll("input[data-field]").forEach(el=>el.onchange=()=>{let k=`${el.dataset.e}_${el.dataset.s}`;s.sets[k]??={};s.sets[k][el.dataset.field]=el.value;save()});document.querySelectorAll("button[data-done]").forEach(el=>el.onclick=()=>{let k=`${el.dataset.e}_${el.dataset.s}`;s.sets[k]??={};s.sets[k].done=!s.sets[k].done;save();render()})}
function progress(){let latest=state.metrics.slice().sort((a,b)=>a.date.localeCompare(b.date));$("app").innerHTML=`<h1 class="title">Tu progreso</h1><p class="muted">Registra peso y cintura una vez por semana. La creatina puede aumentar inicialmente el peso por agua muscular.</p><div class="panel"><h2>Nueva medición</h2><div class="rowgrid"><div><label class="small">Peso corporal (kg)</label><input class="input" id="bodyWeight" type="number" step=".1" placeholder="85"></div><div><label class="small">Cintura (cm)</label><input class="input" id="waist" type="number" step=".1" placeholder="—"></div></div><div style="margin-top:10px"><label class="small">Fecha</label><input class="input" id="metricDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="actions"><button class="primary" id="addMetric">Guardar medición</button></div></div><div class="panel"><h2>Historial corporal</h2>${latest.length?`<table><thead><tr><th>Fecha</th><th>Peso</th><th>Cintura</th></tr></thead><tbody>${latest.map(m=>`<tr><td>${esc(m.date)}</td><td>${esc(m.weight||"—")} kg</td><td>${esc(m.waist||"—")} cm</td></tr>`).join("")}</tbody></table>`:"<p class='muted'>Aún no hay mediciones.</p>"}</div><div class="panel"><h2>Entrenamientos por semana</h2><table><tr><th>Semana</th><th>Series completadas</th></tr>${Array.from({length:Math.max(state.week,1)},(_,i)=>i+1).map(w=>`<tr><td>${w}</td><td>${Object.entries(state.sessions).filter(([k])=>k.startsWith(w+"_")).reduce((a,[k,s])=>a+Object.values(s.sets||{}).filter(r=>r.done).length,0)}</td></tr>`).join("")}</table></div>`;$("addMetric").onclick=()=>{const date=$("metricDate").value,weight=$("bodyWeight").value,waist=$("waist").value;if(!date||(!weight&&!waist)){alert("Introduce fecha y al menos una medida.");return}state.metrics=state.metrics.filter(m=>m.date!==date);state.metrics.push({date,weight,waist});save();render()}}
function settings(){$("app").innerHTML=`<h1 class="title">Privacidad y copias</h1><div class="panel"><h2>🔒 Datos en este dispositivo</h2><p class="muted">Esta versión guarda tus registros en el almacenamiento local del navegador. No tiene cuentas ni envía datos a un servidor. Si borras los datos del navegador, cambias de móvil o abres el archivo desde otra dirección, podrías perder el historial.</p><p class="warning">Privada no significa protegida con contraseña: cualquier persona con acceso a este navegador y perfil puede ver tus registros. No la alojes en una web pública sin añadir autenticación y almacenamiento seguro.</p><div class="actions"><button class="primary" id="export">Exportar copia JSON</button><button class="secondary" id="csv">Exportar CSV</button></div></div><div class="panel"><h2>Restaurar copia</h2><input class="input" type="file" id="import" accept=".json,application/json"><p class="small">Importar sustituye los registros actuales.</p></div><div class="panel"><h2>Eliminar datos</h2><button class="secondary" id="reset">Borrar todos mis registros</button></div><div class="panel"><h2>Tu objetivo</h2><p>Ganar masa muscular en tren superior y glúteos, reducir grasa corporal y reforzar piernas de manera compatible con una lesión antigua de menisco sin síntomas actuales.</p><p class="muted">Creatina: 4 g diarios. Entrenamiento: 5 días de unos 60 minutos, con dos primeras semanas de readaptación.</p></div>`;$("export").onclick=()=>download("mi-gym-copia.json",JSON.stringify(state,null,2),"application/json");$("csv").onclick=()=>{let rows=[["semana","dia","fecha","ejercicio","serie","peso_o_nivel","repeticiones","completada"]];Object.entries(state.sessions).forEach(([id,s])=>{let [w,d]=id.split("_").map(Number);Object.entries(s.sets||{}).forEach(([key,r])=>{let [i,j]=key.split("_").map(Number);rows.push([w,PLAN[d]?.[0],s.date,PLAN[d]?.[1]?.[i]?.[0],j+1,r.weight||"",r.reps||"",r.done?"si":"no"])})});download("mi-gym-series.csv",rows.map(row=>row.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\r\n"),"text/csv")};$("import").onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(!obj.sessions||!obj.metrics||!confirm("¿Sustituir todos los registros actuales?"))return;state=obj;state.day??=0;state.week??=1;save();render();alert("Copia restaurada")}catch{alert("Archivo de copia no válido")}};$("reset").onclick=()=>{if(confirm("¿Borrar definitivamente todos los registros de este navegador?")){state={sessions:{},metrics:[],day:0,week:1};save();render()}}}
function download(name,data,type){const a=document.createElement("a"),url=URL.createObjectURL(new Blob([data],{type}));a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{view=b.dataset.view;render();window.scrollTo(0,0)});render();
if ("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script></body></html>
