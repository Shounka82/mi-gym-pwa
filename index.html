7px}.set button.done{background:#2e8b59;border-color:#63cc8b}.primary{background:#64d798;color:#092316;font-weight:750;border:0;border-radius:12px;padding:13px 16px}.secondary{background:#2b4236;color:#ecf8ef;border:1px solid #577362;border-radius:12px;padding:12px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.input{width:100%;background:#14231c;color:#f4fff7;border:1px solid #577262;border-radius:9px;padding:12px}.rowgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.section{margin:25px 0 10px}.warning{border-left:3px solid #e2c17a;padding:10px 12px;background:#302d21;border-radius:8px;font-size:13px;color:#f4e7c6}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#16251ef5;border-top:1px solid #365044;padding:8px 10px calc(8px + env(safe-area-inset-bottom));gap:6px}.nav button{flex:1;max-width:160px;background:none;border:0;color:#a6bcb0;padding:10px 2px;border-radius:9px}.nav button.active{background:#2c4e3b;color:white}canvas{max-width:100%}table{width:100%;border-collapse:collapse}td,th{padding:9px 3px;border-bottom:1px solid #395045;text-align:left;font-size:13px}input[type=checkbox]{width:20px;height:20px;accent-color:#6cdb9f} @media(max-width:390px){.setgrid{gap:5px}.set{padding:8px 5px}.shell{padding-left:11px;padding-right:11px}}

</style></head><body><header><div class="head"><div><div class="logo">🏋️ Mi Gym</div><div class="small">Tu entrenamiento · Tus datos</div></div><span class="pill">🔒 En este dispositivo</span></div></header><main id="app" class="shell"></main><nav class="nav"><button data-view="train" class="active">🏋️<br>Entrenar</button><button data-view="progress">📈<br>Progreso</button><button data-view="calendar">📅<br>Agenda</button><button data-view="library">📖<br>Técnica</button><button data-view="settings">⚙️<br>Datos</button></nav><script>
"use strict";
const PLAN=[
["Pecho, hombros y tríceps",[["Press de pecho con mancuernas",3,"8–12","kg por mancuerna"],["Press inclinado con mancuernas",3,"10–12","kg por mancuerna"],["Press de hombros sentado",3,"8–12","kg por mancuerna"],["Elevaciones laterales",3,"12–15","kg por mancuerna"],["Extensión de tríceps con mancuerna",3,"10–15","kg total"]]],
["Glúteos y piernas",[["Hip thrust con barra",4,"8–12","kg total"],["Peso muerto rumano con mancuernas",3,"10–12","kg por mancuerna"],["Sentadilla parcial al banco",3,"10–12","kg total"],["Abducción de cadera tumbado de lado",3,"15 por lado","kg opcional"],["Elevación de gemelos",3,"12–15","kg total"]]],
["Espalda, bíceps y abdominales",[["Remo con mancuerna en banco",4,"8–12 por lado","kg por mancuerna"],["Remo en TRX",3,"10–12","inclinación (escribe nivel)"],["Pájaros con mancuernas",3,"12–15","kg por mancuerna"],["Curl de bíceps con mancuernas",3,"10–12","kg por mancuerna"],["Plancha abdominal",3,"30–45 s","segundos"]]],
["Glúteos, rodilla y core",[["Glute bridge con mancuerna",3,"12–15","kg total"],["Peso muerto rumano con barra",3,"10–12","kg total"],["Sentarse y levantarse del banco",3,"10–12","kg total"],["Elevación de pierna recta tumbado",3,"12 por lado","kg opcional"],["Crunch abdominal",3,"12–15","repeticiones"]]],
["Tren superior completo",[["Press de pecho con mancuernas",3,"8–12","kg por mancuerna"],["Remo con mancuerna en banco",3,"10 por lado","kg por mancuerna"],["Press de hombros sentado",3,"10–12","kg por mancuerna"],["Curl martillo con mancuernas",3,"10–12","kg por mancuerna"],["Extensión de tríceps con mancuerna",3,"12","kg total"]]]
];

const STORE="migym_v1";
let state;try{state=JSON.parse(localStorage.getItem(STORE))||{}}catch{state={}}
state.sessions??={};state.metrics??=[];state.day??=0;state.week??=1;state.schedule??={};state.restSeconds??=90;
let view="train",openExercise=0,restUntil=0,ticker=null,alarmCtx=null,selectedExercise="Hip thrust con barra",calendarMonth=new Date().toISOString().slice(0,7);
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const save=()=>{try{localStorage.setItem(STORE,JSON.stringify(state))}catch{alert("No se ha podido guardar. Exporta una copia de seguridad.")}};
const sid=()=>`${state.week}_${state.day}`;
function session(){let k=sid();return state.sessions[k]??(state.sessions[k]={date:new Date().toISOString().slice(0,10),sets:{},notes:"",warm:false,cardio:false,cool:false})}
const count=(s)=>Object.values(s?.sets||{}).filter(r=>r.done).length;
const expected=d=>PLAN[d][1].reduce((a,e)=>a+(state.week===1?2:state.week===2?Math.min(3,e[1]):e[1]),0);
const datestr=d=>d.toISOString().slice(0,10);
const uniqueNames=()=>[...new Set(PLAN.flatMap(d=>d[1].map(e=>e[0])))];
function recordsFor(name,excludeId){let results=[];
 for(const [id,s] of Object.entries(state.sessions)){if(id===excludeId)continue;const [w,d]=id.split("_").map(Number);if(!PLAN[d])continue;
 PLAN[d][1].forEach((e,i)=>{if(e[0]!==name)return;let records=Object.entries(s.sets||{}).filter(([k,r])=>k.startsWith(i+"_")&&r.done).map(([k,r])=>r);
 if(records.length)results.push({w,d,date:s.date||"",records})})}
 return results.sort((a,b)=>(b.date||"").localeCompare(a.date||"")||b.w-a.w||b.d-a.d)
}
function lastFor(name){const list=recordsFor(name,sid());const current=session().date;return list.find(r=>r.date<=current)||list[0]||null}
function bestFor(name){let points=[];for(const r of recordsFor(name,null)){for(const set of r.records){let weight=Number(set.weight),reps=Number(set.reps);if(Number.isFinite(weight)&&weight>0&&Number.isFinite(reps)&&reps>0)points.push({date:r.date,weight,reps,volume:weight*reps})}}return points}
function formatLast(e){let last=lastFor(e[0]);if(!last)return '<div class="last-session">Sin registros anteriores. ¡Este será tu punto de partida!</div>';
return `<div class="last-session"><strong>Última sesión · ${esc(last.date||"Semana "+last.w)}</strong><br>${last.records.map((r,i)=>`${i+1}ª: ${esc(r.weight??"—")} ${e[3].includes("kg")?"kg":""} × ${esc(r.reps??"—")}`).join(" · ")}</div>`}
function target(e){const m=e[2].match(/(\d+)[–-](\d+)/);return m?+m[2]:null}
function hint(e){if(!e[3].includes("kg"))return "";let last=lastFor(e[0]);if(!last)return "";
let t=target(e);if(!t)return "";
let completed=last.records.length>=Math.min(e[1],state.week===1?2:state.week===2?3:e[1]);
let good=last.records.every(r=>Number(r.reps)>=t&&Number(r.weight)>0);
if(completed&&good)return "💡 Completaste el máximo de repeticiones. Si la técnica fue buena y no hubo molestias, podrías probar un pequeño aumento de carga.";
return "💡 Puedes repetir la última carga y buscar mejorar las repeticiones manteniendo buena técnica."}
function render(){document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===view));({train,progress,calendar,library,settings})[view]();updateTimer()}
function timerStart(){restUntil=Date.now()+state.restSeconds*1000;updateTimer();if(ticker)clearInterval(ticker);ticker=setInterval(updateTimer,300)}
function updateTimer(){let el=$("timerDigits");if(!el)return;let remain=Math.max(0,Math.ceil((restUntil-Date.now())/1000));el.textContent=`${String(Math.floor(remain/60)).padStart(2,"0")}:${String(remain%60).padStart(2,"0")}`;
if(remain===0&&restUntil){restUntil=0;if(ticker)clearInterval(ticker);ticker=null;try{navigator.vibrate?.([180,90,180])}catch{};try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=720;g.gain.value=.1;o.start();o.stop(a.currentTime+.25);o.onended=()=>a.close()}catch{}}
}
function train(){
const s=session(),p=PLAN[state.day],total=PLAN.reduce((a,_,i)=>a+count(state.sessions[`${state.week}_${i}`]),0),max=PLAN.reduce((a,_,i)=>a+expected(i),0);
$("app").innerHTML=`<div class="toolbar"><div><div class="small">PLAN PERSONAL · 5 DÍAS</div><h1 class="title">Semana ${state.week}</h1></div><div class="actions"><button class="secondary" id="prevW" ${state.week===1?"disabled":""}>−</button><button class="secondary" id="nextW">+</button></div></div>
<div class="muted">Series completadas: ${total}/${max}</div><div class="progress"><div style="width:${Math.min(100,total/max*100)}%"></div></div>
<div class="tabs">${PLAN.map((p,i)=>`<button class="tab ${i===state.day?"active":""}" data-day="${i}">${["L","M","X","J","V"][i]}<br><small>${count(state.sessions[`${state.week}_${i}`])}/${expected(i)}</small></button>`).join("")}</div>
<h1 class="title">${p[0]}</h1><p class="muted">8 min calentar · 42 min fuerza · 5 min cardio · 5 min vuelta a la calma</p>
${state.week<=2?`<p class="warning">Semana ${state.week}: readaptación. ${state.week===1?"2 series por ejercicio":"2–3 series por ejercicio"} y 3–4 repeticiones en reserva.</p>`:""}
<div class="panel"><label class="small">Fecha real de esta sesión</label><input class="input" id="date" type="date" value="${esc(s.date)}"><p><label><input type="checkbox" id="warm" ${s.warm?"checked":""}> Calentamiento realizado (8 min)</label></p></div>
<div class="timerbox"><div class="toolbar"><div><div class="small">DESCANSO ENTRE SERIES</div><div class="timerdigits" id="timerDigits">00:00</div></div><div><select id="restSelect">${[60,90,120,150,180].map(n=>`<option value="${n}" ${state.restSeconds===n?"selected":""}>${n}s</option>`).join("")}</select><div class="actions"><button class="secondary" id="timerStart">Iniciar</button><button class="secondary" id="timerStop">Parar</button></div></div></div><div class="small">Al marcar una serie se inicia el descanso. El aviso puede no sonar si Android suspende la app en segundo plano.</div></div>
<h2 class="section">Ejercicios · toca para desplegar</h2>
${p[1].map((e,i)=>{let n=state.week===1?2:state.week===2?Math.min(3,e[1]):e[1];let done=Object.entries(s.sets||{}).filter(([k,r])=>k.startsWith(i+"_")&&r.done).length;return `<details class="panel exercise-accordion" data-exercise="${i}" ${openExercise===i?"open":""}><summary><div><div class="exercise-heading">${i+1}. ${e[0]}</div><div class="detail">${n} series · ${e[2]} · ${e[3]}</div></div><div class="line"><span class="pill">${done}/${n}</span><span class="exercise-chevron">⌄</span></div></summary><div class="exercise-inner">${formatLast(e)}${hint(e)?`<p class="exercise-note">${hint(e)}</p>`:""}<div class="setgrid">${Array.from({length:n},(_,j)=>{let r=s.sets[`${i}_${j}`]||{};return `<div class="set"><label>Serie ${j+1}</label><label>${e[3].includes("kg")?"Peso (kg)":e[3].includes("segundos")?"Segundos":e[3].includes("inclinación")?"Nivel":"Reps"}</label><input data-e="${i}" data-s="${j}" data-field="weight" type="${e[3].includes("inclinación")?"text":"number"}" step="any" min="0" placeholder="—" value="${esc(r.weight??"")}"><label>Reps / tiempo</label><input data-e="${i}" data-s="${j}" data-field="reps" type="number" min="0" placeholder="—" value="${esc(r.reps??"")}"><button data-e="${i}" data-s="${j}" data-done="1" class="${r.done?"done":""}">${r.done?"✓ Hecha":"Marcar"}</button></div>`}).join("")}</div><div class="actions"><button class="secondary" data-guide="${esc(e[0])}">📖 Técnica</button></div></div></details>`}).join("")}
<div class="panel"><p><label><input type="checkbox" id="cardio" ${s.cardio?"checked":""}> Cardio sin impacto (5 min)</label></p><p><label><input type="checkbox" id="cool" ${s.cool?"checked":""}> Vuelta a la calma (5 min)</label></p><label class="small">Notas · Rodilla y sensaciones</label><textarea class="input" id="notes" rows="3">${esc(s.notes)}</textarea></div>
<p class="warning">Menisco: detén el ejercicio ante dolor, hinchazón, bloqueo o inestabilidad. Evita los giros bruscos y progresiones precipitadas.</p><button class="primary" id="nextDay">Siguiente día →</button>`;
document.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{state.day=+b.dataset.day;openExercise=0;save();render()});
$("prevW").onclick=()=>{state.week=Math.max(1,state.week-1);openExercise=0;save();render()};
$("nextW").onclick=()=>{state.week++;openExercise=0;save();render()};
$("nextDay").onclick=()=>{state.day=(state.day+1)%5;openExercise=0;save();render()};
["date","warm","cardio","cool","notes"].forEach(k=>$(k).onchange=e=>{s[k]=e.target.type==="checkbox"?e.target.checked:e.target.value;save()});
$("restSelect").onchange=e=>{state.restSeconds=+e.target.value;save()};
$("timerStart").onclick=timerStart;$("timerStop").onclick=()=>{restUntil=0;updateTimer()};
document.querySelectorAll("details[data-exercise]").forEach(el=>el.addEventListener("toggle",()=>{if(el.open){openExercise=+el.dataset.exercise;document.querySelectorAll("details[data-exercise]").forEach(other=>{if(other!==el)other.open=false})}else if(openExercise===+el.dataset.exercise){openExercise=-1}}));
document.querySelectorAll("input[data-field]").forEach(el=>el.onchange=()=>{let k=`${el.dataset.e}_${el.dataset.s}`;s.sets[k]??={};s.sets[k][el.dataset.field]=el.value;save()});
document.querySelectorAll("button[data-done]").forEach(el=>el.onclick=()=>{let k=`${el.dataset.e}_${el.dataset.s}`;s.sets[k]??={};s.sets[k].done=!s.sets[k].done;openExercise=+el.dataset.e;save();if(s.sets[k].done)timerStart();render()});
document.querySelectorAll("[data-guide]").forEach(el=>el.onclick=()=>{selectedExercise=el.dataset.guide;view="library";render()});
}
function chartSvg(data,field,unit){let values=data.filter(x=>Number.isFinite(+x[field])&&x[field]!==""&&+x[field]>0).sort((a,b)=>a.date.localeCompare(b.date));if(!values.length)return `<p class="muted">Aún no hay datos para mostrar.</p>`;
let max=Math.max(...values.map(x=>+x[field])),min=Math.min(...values.map(x=>+x[field]));let lo=Math.max(0,min-(max-min||max*.1||1)*.3),hi=max+(max-min||max*.1||1)*.3;let pts=values.map((x,i)=>[30+i*300/Math.max(1,values.length-1),155-(+x[field]-lo)/(hi-lo)*125]);let points=pts.map(p=>p.join(",")).join(" ");return `<svg class="chart" viewBox="0 0 360 200" role="img" aria-label="Evolución de ${esc(unit)}"><path d="M30 12 V155 H342" stroke="#718b7a" fill="none"/><polyline points="${points}" fill="none" stroke="#69db9d" stroke-width="3"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#d4f9dd"/>`).join("")}<text x="4" y="25" fill="#d5e9d9" font-size="11">${hi.toFixed(1)} ${esc(unit)}</text><text x="4" y="155" fill="#d5e9d9" font-size="11">${lo.toFixed(1)}</text><text x="30" y="185" fill="#b9d4c0" font-size="11">${esc(values[0].date)}</text><text x="342" y="185" text-anchor="end" fill="#b9d4c0" font-size="11">${esc(values.at(-1).date)}</text></svg>`}
function progress(){const latest=state.metrics.slice().sort((a,b)=>a.date.localeCompare(b.date)),names=uniqueNames(),points=bestFor(selectedExercise),maxWeight=points.length?Math.max(...points.map(p=>p.weight)):null;
$("app").innerHTML=`<h1 class="title">Progreso y récords</h1><div class="panel"><h2>Evolución de fuerza</h2><label class="small">Ejercicio</label><select class="input" id="exSelect">${names.map(n=>`<option ${n===selectedExercise?"selected":""}>${esc(n)}</option>`).join("")}</select><p><span class="tag">Mejor carga: ${maxWeight??"—"} kg</span> <span class="tag">Series registradas: ${points.length}</span></p>${chartSvg(points,"weight","kg")}<p class="small">Gráfico de cargas de series completadas. Compara el mismo ejercicio y técnica.</p></div><div class="panel"><h2>Medición corporal</h2><div class="rowgrid"><div><label class="small">Peso (kg)</label><input class="input" id="bodyWeight" type="number" step=".1" placeholder="85"></div><div><label class="small">Cintura (cm)</label><input class="input" id="waist" type="number" step=".1"></div></div><div style="margin-top:10px"><label class="small">Fecha</label><input class="input" id="metricDate" type="date" value="${datestr(new Date())}"></div><div class="actions"><button class="primary" id="addMetric">Guardar medición</button></div><h2 class="section">Peso corporal</h2>${chartSvg(latest,"weight","kg")}<h2 class="section">Cintura</h2>${chartSvg(latest,"waist","cm")}</div><div class="panel"><h2>Mediciones anteriores</h2>${latest.length?`<table><tr><th>Fecha</th><th>Peso</th><th>Cintura</th></tr>${latest.map(m=>`<tr><td>${esc(m.date)}</td><td>${esc(m.weight||"—")}</td><td>${esc(m.waist||"—")}</td></tr>`).join("")}</table>`:"<p class='muted'>Todavía no hay registros.</p>"}</div>`;
$("exSelect").onchange=e=>{selectedExercise=e.target.value;render()};
$("addMetric").onclick=()=>{let date=$("metricDate").value,weight=$("bodyWeight").value,waist=$("waist").value;if(!date||(!weight&&!waist)){alert("Introduce una fecha y al menos una medida.");return}state.metrics=state.metrics.filter(m=>m.date!==date);state.metrics.push({date,weight,waist});save();render()}
}
function calendar(){let [year,month]=calendarMonth.split("-").map(Number),first=new Date(year,month-1,1),days=new Date(year,month,0).getDate(),offset=(first.getDay()+6)%7;
let logged=new Set(Object.values(state.sessions).filter(s=>count(s)>0).map(s=>s.date));let appointments=Object.entries(state.schedule).filter(([date])=>date.startsWith(calendarMonth)).sort(([a],[b])=>a.localeCompare(b));
$("app").innerHTML=`<h1 class="title">Calendario flexible</h1><p class="muted">Planifica el entrenamiento en la fecha que te venga bien, independientemente del día de la semana.</p><div class="panel"><div class="toolbar"><button class="secondary" id="monthPrev">←</button><strong>${first.toLocaleDateString("es",{month:"long",year:"numeric"})}</strong><button class="secondary" id="monthNext">→</button></div><div class="calgrid" style="margin-top:12px">${["L","M","X","J","V","S","D"].map(x=>`<span class="small" style="text-align:center">${x}</span>`).join("")}${Array.from({length:offset},()=>"<span></span>").join("")}${Array.from({length:days},(_,i)=>{let date=`${calendarMonth}-${String(i+1).padStart(2,"0")}`;return `<button class="calday ${logged.has(date)?"logged":""} ${state.schedule[date]?"selected":""}" data-date="${date}">${i+1}${state.schedule[date]?" •":""}</button>`}).join("")}</div><p class="small">Borde verde: sesión registrada · Fondo verde: sesión planificada</p></div><div class="panel"><h2>Programar un entrenamiento</h2><label class="small">Fecha</label><input class="input" id="planDate" type="date" value="${datestr(new Date())}"><label class="small">Sesión</label><select class="input" id="planWorkout"><option value="">Descanso / eliminar planificación</option>${PLAN.map((p,i)=>`<option value="${i}">${esc(p[0])}</option>`).join("")}</select><div class="actions"><button class="primary" id="savePlan">Guardar en calendario</button></div></div><div class="panel"><h2>Sesiones planificadas</h2>${appointments.length?appointments.map(([date,d])=>`<div class="line" style="padding:8px 0"><span>${esc(date)} · ${esc(PLAN[d]?.[0]||"—")}</span><button class="secondary" data-plan-open="${date}">Abrir</button></div>`).join(""):"<p class='muted'>No hay sesiones planificadas este mes.</p>"}</div>`;
$("monthPrev").onclick=()=>{calendarMonth=datestr(new Date(year,month-2,1)).slice(0,7);render()};$("monthNext").onclick=()=>{calendarMonth=datestr(new Date(year,month,1)).slice(0,7);render()};
document.querySelectorAll("[data-date]").forEach(b=>b.onclick=()=>{$("planDate").value=b.dataset.date;$("planWorkout").value=state.schedule[b.dataset.date]??""});
$("savePlan").onclick=()=>{let date=$("planDate").value,day=$("planWorkout").value;if(!date)return;if(day==="")delete state.schedule[date];else state.schedule[date]=+day;calendarMonth=date.slice(0,7);save();render()};
document.querySelectorAll("[data-plan-open]").forEach(b=>b.onclick=()=>{let date=b.dataset.planOpen;state.day=state.schedule[date];let s=session();if(count(s)===0)s.date=date;save();view="train";openExercise=0;render()})

function settings(){$("app").innerHTML=`<h1 class="title">Privacidad y copias</h1><div class="panel"><h2>🔒 Solo en tu móvil</h2><p class="muted">Los registros se guardan en el navegador del dispositivo. No se suben a GitHub ni a ningún servidor. La app no tiene contraseña propia.</p><p class="warning">Antes de cada actualización, exporta una copia JSON. No borres los datos de Chrome o de la app instalada.</p><div class="actions"><button class="primary" id="export">Exportar copia JSON</button><button class="secondary" id="csv">Exportar CSV</button></div></div><div class="panel"><h2>Restaurar copia</h2><input class="input" type="file" id="import" accept=".json,application/json"><p class="small">Importar reemplaza todos los registros actuales.</p></div><div class="panel"><h2>Eliminar datos</h2><button class="secondary" id="reset">Borrar mis registros</button></div><div class="panel"><h2>Tu objetivo</h2><p>Hipertrofia de tren superior y glúteos; progresión prudente de piernas con antecedente de menisco izquierdo.</p><p class="muted">5 días por semana · 60 minutos · creatina 4 g/día.</p></div>`;
$("export").onclick=()=>download("mi-gym-copia.json",JSON.stringify(state,null,2),"application/json");
$("csv").onclick=()=>{let rows=[["semana","dia","fecha","ejercicio","serie","peso_o_nivel","repeticiones","completada"]];Object.entries(state.sessions).forEach(([id,s])=>{let [w,d]=id.split("_").map(Number);Object.entries(s.sets||{}).forEach(([key,r])=>{let [i,j]=key.split("_").map(Number);rows.push([w,PLAN[d]?.[0],s.date,PLAN[d]?.[1]?.[i]?.[0],j+1,r.weight||"",r.reps||"",r.done?"si":"no"])})});download("mi-gym-series.csv",rows.map(row=>row.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\r\n"),"text/csv")};
$("import").onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(!obj.sessions||!Array.isArray(obj.metrics)||!confirm("¿Reemplazar todos los registros actuales?"))return;state=obj;state.day??=0;state.week??=1;state.schedule??={};state.restSeconds??=90;save();render();alert("Copia restaurada")}catch{alert("Archivo de copia no válido")}};
$("reset").onclick=()=>{if(confirm("¿Borrar todos los registros de este dispositivo?")){state={sessions:{},metrics:[],day:0,week:1,schedule:{},restSeconds:90};save();render()}}
}
function download(name,data,type){const a=document.createElement("a"),url=URL.createObjectURL(new Blob([data],{type}));a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
